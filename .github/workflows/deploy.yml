name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Stage Pages metadata in dist
        run: |
          set -euo pipefail
          if [ -f public/CNAME ]; then cp public/CNAME dist/CNAME
          elif [ -f CNAME ]; then cp CNAME dist/CNAME
          fi
          touch dist/.nojekyll
          test -f dist/404.html || cp dist/index.html dist/404.html
          grep -E 'assets/.*\.(js|css)' dist/index.html
          ls -la dist

      - name: Hard-clear wedged github-pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          echo "::group::Pages state before clear"
          gh api "repos/$R/pages" --jq '{status, build_type, source, cname}' || true
          echo "::endgroup::"
          gh api -X PUT "repos/$R/environments/github-pages" --input - <<'EOF' || true
          {"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":false}}
          EOF
          echo "::group::Clear deployments"
          page=1
          while [ "$page" -le 5 ]; do
            ids=$(gh api "repos/$R/deployments?environment=github-pages&per_page=50&page=$page" --jq '.[].id')
            [ -z "$ids" ] && break
            for id in $ids; do
              state=$(gh api "repos/$R/deployments/$id/statuses" --jq '.[0].state // "none"' 2>/dev/null || echo none)
              echo "deployment $id state=$state"
              gh api -X POST "repos/$R/deployments/$id/statuses" \
                -f state=inactive \
                -f description='clear wedged pages lock' \
                -f environment=github-pages >/dev/null 2>&1 || true
              gh api -X DELETE "repos/$R/deployments/$id" >/dev/null 2>&1 \
                && echo "  deleted $id" \
                || echo "  delete $id skipped"
            done
            page=$((page + 1))
          done
          echo "::endgroup::"
          sleep 3
          gh api "repos/$R/pages" --jq '{status, build_type, source, cname}' || true

      - name: Publish dist to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
          force: true

      - name: Bump gh-pages to retrigger Pages build
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git checkout gh-pages
          date -u +"redeploy %Y-%m-%dT%H:%M:%SZ" > .pages-redeploy
          git add .pages-redeploy
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: retrigger Pages publish after clearing deploy lock" || true
          git push origin gh-pages
          git checkout main

      - name: Wait until live site serves the Vite build
        run: |
          set -euo pipefail
          URL="https://spider.siaroza.com/"
          echo "Polling $URL for /assets/*.js (not /src/main.tsx)..."
          for i in $(seq 1 60); do
            html=$(curl -fsS "$URL" 2>/dev/null || true)
            if echo "$html" | grep -qE '/assets/[^"]+\.js' \
              && ! echo "$html" | grep -q '/src/main.tsx'; then
              asset=$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://spider.siaroza.com${asset}")
              echo "attempt $i: $asset -> HTTP $code"
              if [ "$code" = "200" ]; then
                echo "Live site is serving the Vite build."
                exit 0
              fi
            else
              st=$(gh api "repos/${{ github.repository }}/pages" --jq '.status' 2>/dev/null || echo '?')
              echo "attempt $i: still broken/old HTML (pages status=$st)"
            fi
            sleep 10
          done
          echo "::error::Timed out. Pages is likely still latched. Do the manual unlock steps in the README."
          curl -fsS "$URL" | head -40 || true
          echo
          echo "Open: https://github.com/${{ github.repository }}/settings/pages"
          echo "And:  https://github.com/${{ github.repository }}/deployments/activity_log?environments_filter=github-pages"
          exit 1
