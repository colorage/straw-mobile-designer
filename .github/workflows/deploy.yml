name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Do NOT use the concurrency group "pages" here: GitHub's built-in
# "pages build and deployment" workflow uses that group, so sharing it makes
# our wait step block the very Pages build it is waiting for (deadlock until
# timeout, runs stuck on "deployment_in_progress").
concurrency:
  group: deploy-to-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Stage Pages metadata in dist
        run: |
          set -euo pipefail
          if [ -f public/CNAME ]; then cp public/CNAME dist/CNAME
          elif [ -f CNAME ]; then cp CNAME dist/CNAME
          fi
          touch dist/.nojekyll
          test -f dist/404.html || cp dist/index.html dist/404.html
          grep -E 'assets/.*\.(js|css)' dist/index.html
          ls -la dist

      - name: Check Pages settings (Actions cannot change them)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          cfg=$(gh api "repos/$R/pages" 2>/dev/null || echo '{}')
          build_type=$(echo "$cfg" | jq -r '.build_type // "missing"')
          branch=$(echo "$cfg" | jq -r '.source.branch // "missing"')
          cname=$(echo "$cfg" | jq -r '.cname // "none"')
          echo "Pages config: build_type=$build_type source.branch=$branch cname=$cname"
          ok=1
          if [ "$build_type" != "legacy" ] || [ "$branch" != "gh-pages" ]; then
            echo "::error::Pages source must be 'Deploy from a branch' -> gh-pages / (root). The API returns 403 for Actions tokens, so fix it manually: https://github.com/$R/settings/pages"
            ok=0
          fi
          expected=$(cat dist/CNAME 2>/dev/null || true)
          if [ -n "$expected" ] && [ "$cname" != "$expected" ]; then
            echo "::error::Custom domain is '$cname' but should be '$expected'. Re-add it manually: https://github.com/$R/settings/pages"
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then
            echo "Publishing to gh-pages anyway so the site goes live as soon as the settings are fixed."
            echo "PAGES_MISCONFIGURED=1" >> "$GITHUB_ENV"
          fi

      - name: Publish dist to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
          force: true

      - name: Fail fast when Pages settings need a manual fix
        if: env.PAGES_MISCONFIGURED == '1'
        run: |
          echo "::error::gh-pages was updated, but the site cannot go live until Pages settings are fixed (see 'Check Pages settings' step above)."
          exit 1

      - name: Wait until the live site serves this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          DOMAIN=$(cat dist/CNAME 2>/dev/null || true)
          if [ -n "$DOMAIN" ]; then
            URL="https://$DOMAIN/"
          else
            URL=$(gh api "repos/$R/pages" --jq '.html_url')
          fi
          expected_asset=$(grep -oE '/assets/[^"]+\.js' dist/index.html | head -1)
          echo "Polling $URL for $expected_asset ..."
          for i in $(seq 1 54); do
            html=$(curl -fsS "$URL" 2>/dev/null || true)
            if echo "$html" | grep -qF "$expected_asset"; then
              code=$(curl -s -o /dev/null -w '%{http_code}' "${URL%/}${expected_asset}")
              echo "attempt $i: $expected_asset -> HTTP $code"
              if [ "$code" = "200" ]; then
                echo "Live site is serving this build."
                exit 0
              fi
            else
              st=$(gh api "repos/$R/pages" --jq '.status' 2>/dev/null || echo '?')
              echo "attempt $i: live HTML does not reference this build yet (pages status=$st)"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Pages build. Check the 'pages build and deployment' runs at https://github.com/$R/actions and the settings at https://github.com/$R/settings/pages"
          exit 1
