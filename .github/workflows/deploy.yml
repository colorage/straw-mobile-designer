name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  # Queue deploys instead of canceling — mid-flight cancels leave Pages stuck
  # in deployment_queued / "Deployment cancelled" until it clears.
  group: pages
  cancel-in-progress: false

jobs:
  # Unwedge Pages before building. A prior switch to "Deploy from a branch"
  # (legacy) plus cancelled Actions deploys leaves status=building and blocks
  # new deploy-pages requests with "in progress deployment… cancel X first".
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reset Pages to GitHub Actions and clear stuck deploys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"

          echo "::group::Current Pages state"
          gh api "repos/$R/pages" --jq '{status, build_type, source, html_url, cname}' || true
          echo "::endgroup::"

          build_type=$(gh api "repos/$R/pages" --jq '.build_type // "unknown"' 2>/dev/null || echo "unknown")
          if [ "$build_type" != "workflow" ]; then
            echo "Pages build_type is '$build_type' — switching to GitHub Actions (workflow)"
            printf '{"build_type":"workflow"}' | gh api -X PUT "repos/$R/pages" --input -
            sleep 5
          else
            echo "Pages already on workflow source"
          fi

          echo "::group::Cancel stuck Pages deployments"
          # Cancel any non-terminal github-pages deployments that block create.
          gh api "repos/$R/deployments?environment=github-pages&per_page=20" --jq '.[].id' \
            | while read -r id; do
                state=$(gh api "repos/$R/deployments/$id/statuses" --jq '.[0].state // "unknown"' 2>/dev/null || echo "unknown")
                echo "deployment $id state=$state"
                case "$state" in
                  in_progress|queued|pending)
                    echo "Canceling Pages deployment for deployment id $id"
                    # Prefer Pages cancel by deployment SHA/id when available
                    sha=$(gh api "repos/$R/deployments/$id" --jq '.sha' 2>/dev/null || true)
                    if [ -n "${sha:-}" ]; then
                      gh api -X POST "repos/$R/pages/deployments/$sha/cancel" >/dev/null 2>&1 \
                        && echo "canceled pages deployment $sha" \
                        || echo "pages cancel for $sha skipped/failed (may already be gone)"
                    fi
                    ;;
                esac
              done
          echo "::endgroup::"

          # Also try canceling the known wedged build versions from recent failures.
          for sha in \
            822afadc25b46690f04c85fa79dce0c543cabca8 \
            a8a6c69d38a1219d99702b5c5c4bf2614a2c83ea \
            f23ed3fff97983df20fdab916322053e382c849e \
            d7c18cf75de3fdb61d7465aca0d37ba0f185ff0a
          do
            gh api -X POST "repos/$R/pages/deployments/$sha/cancel" >/dev/null 2>&1 \
              && echo "canceled pages deployment $sha" \
              || true
          done

          echo "::group::Pages state after reset"
          sleep 3
          gh api "repos/$R/pages" --jq '{status, build_type, source, html_url, cname}' || true
          echo "::endgroup::"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure CNAME in dist for custom domain
        run: |
          if [ -f public/CNAME ]; then
            cp public/CNAME dist/CNAME
          elif [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi
          ls -la dist/CNAME || echo "No CNAME (Pages settings cname may still apply)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Give Pages more time to leave deployment_queued after prior cancels.
          timeout: 600000
