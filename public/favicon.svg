<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Павучы клуб">
  <rect width="64" height="64" rx="14" fill="#11131a"/>
  <!-- Ceiling hook -->
  <circle cx="32" cy="10" r="3" fill="#4b5bd6"/>
  <!-- Thread to octahedron -->
  <line x1="32" y1="13" x2="32" y2="22" stroke="#9aa0b5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Octahedron / himmeli diamond (straw edges) -->
  <g fill="none" stroke="#4b5bd6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 22 L44 34 L32 46 L20 34 Z"/>
    <path d="M32 22 L32 46"/>
    <path d="M20 34 L44 34"/>
  </g>
  <!-- Corner joints -->
  <g fill="#6b7cff">
    <circle cx="32" cy="22" r="2"/>
    <circle cx="44" cy="34" r="2"/>
    <circle cx="32" cy="46" r="2"/>
    <circle cx="20" cy="34" r="2"/>
  </g>
</svg>
